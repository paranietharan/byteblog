name: byteblog

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  api:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE_NAME}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
      DB_URL: ${DOCKER_DB_URL}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS}
      DB_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      MAIL_ENABLED: ${MAIL_ENABLED}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS}
      MAIL_TIMEOUT_MS: ${MAIL_TIMEOUT_MS}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS}
      APP_API_BASE_URL: ${APP_API_BASE_URL}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      JAVA_OPTS: ${JAVA_OPTS}
    ports:
      - "${APP_HOST_PORT}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:${SERVER_PORT}/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME}

networks:
  backend:
    driver: bridge
