server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: byteblog
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: ByteblogPool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${MAIL_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${MAIL_WRITE_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Byteblog API

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.paranietharan.byteblog: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:Byteblog}
    api-base-url: ${APP_API_BASE_URL}
    frontend-base-url: ${APP_FRONTEND_BASE_URL}
    outbox-batch-size: ${MAIL_OUTBOX_BATCH_SIZE:20}
    outbox-max-attempts: ${MAIL_OUTBOX_MAX_ATTEMPTS:5}
    outbox-processing-timeout-minutes: ${MAIL_OUTBOX_PROCESSING_TIMEOUT_MINUTES:15}
    outbox-fixed-delay-ms: ${MAIL_OUTBOX_FIXED_DELAY_MS:5000}
    outbox-recovery-delay-ms: ${MAIL_OUTBOX_RECOVERY_DELAY_MS:60000}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_FRONTEND_BASE_URL}}
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      login-limit: ${AUTH_LOGIN_LIMIT:10}
      login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:60}
      registration-limit: ${AUTH_REGISTRATION_LIMIT:5}
      registration-window-seconds: ${AUTH_REGISTRATION_WINDOW_SECONDS:3600}
      refresh-limit: ${AUTH_REFRESH_LIMIT:20}
      refresh-window-seconds: ${AUTH_REFRESH_WINDOW_SECONDS:60}
      verification-limit: ${AUTH_VERIFICATION_LIMIT:20}
      verification-window-seconds: ${AUTH_VERIFICATION_WINDOW_SECONDS:3600}
      cleanup-cron: ${AUTH_RATE_LIMIT_CLEANUP_CRON:0 15 3 * * *}
  posts:
    scheduled-publish-batch-size: ${SCHEDULED_PUBLISH_BATCH_SIZE:50}
    scheduled-publish-delay-ms: ${SCHEDULED_PUBLISH_DELAY_MS:30000}
