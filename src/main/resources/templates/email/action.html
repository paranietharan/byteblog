<!doctype html>
<html lang="en">
<body style="margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827">
  <main style="max-width:600px;margin:32px auto;background:#fff;border-radius:10px;padding:32px">
    <div style="font-size:22px;font-weight:700;color:#2563eb;margin-bottom:24px">Byteblog</div>
    <p>Hello {{name}},</p>
    <h1 style="font-size:24px;margin:20px 0 12px">{{heading}}</h1>
    <p style="line-height:1.6;color:#374151">{{message}}</p>
    <p style="margin:28px 0">
      <a href="{{buttonUrl}}" style="background:#2563eb;color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block">{{buttonText}}</a>
    </p>
    <p style="margin-top:32px;color:#6b7280;font-size:13px">This is an automatic notification from Byteblog.</p>
  </main>
</body>
</html>
